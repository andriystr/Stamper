<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Document</title>
	<link rel="stylesheet" href="style.css">
</head>
<body>
	<header>
		<div class="wrapper-left"></div>
		<h2>Panel</h2>
		<div class="wrapper-right"></div>
	</header>
	
	<div class="frame-wrapper">
		<div class="frame editor">
			<div class="title">
				<h3>Title</h3>
			</div>
			<div class="text">Some text</div>
			<div class="controls">
				<button>Ok</button>
			</div>
		</div>
	</div>

	<div class="frame-wrapper">
		<div class="frame edit-card">
			<div class="text-list">
				<div class="text-part">
					<div class="title">
						<h3>title</h3>
					</div>
					<div class="text">text</div>
					<div class="controls">
						<button>Ok</button>
					</div>
				</div>
			</div>
		</div>
	</div>

	<div class="frame-wrapper">
		<div class="frame menu">
			<div class="card">
				<h3>Card 1</h3>
				<div class="controls"></div>
			</div>
			<div class="card">
				<h3>Card 2</h3>
				<div class="controls"></div>
			</div>
		</div>
	</div>
</body>
</html>
