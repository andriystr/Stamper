<!DOCTYPE html>
<html lang="uk">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Stamper</title>
	<link rel="icon" type="image/png" href="favicon.png">
	<link rel="manifest" href="manifest.json">
	<link rel="stylesheet" href="style.css">
	<script src="script.js"></script>
</head>
<body>
	<header>
		<div class="wrapper-left">
			<button class="left"></button>
		</div>
		<h2 class="title">Картки</h2>
		<div class="wrapper-right">
			<button class="right"></button>
		</div>
	</header>
	
	<div class="frame-wrapper">
		<div class="frame trainer">
			<div class="editor">
				<div class="title">
					<h3>Назва</h3>
						<span class="progress"></span>
				</div>
				<pre class="text" spellcheck="false"></pre>
				<div class="controls">
					<button class="action-back-text">Назад</button>
					<button class="action-next-text">Далі</button>
				</div>
			</div>
		</div>
	</div>

	<div class="frame-wrapper">
		<div class="frame edit-card">
			<h2 class="card-name" contenteditable="true">Назва картки</h2>
			<div class="text-list"></div>
			<p class="form-message" role="alert"></p>
			<div class="controls">
				<button class="action-add">Додати</button>
				<button class="action-save">Зберегти</button>
			</div>
		</div>
	</div>

	<div class="frame-wrapper">
		<div class="frame menu">
			<div class="card-list">
				<div class="card">
					<h3>Картка 1</h3>
					<div class="controls">
						<button class="action-edit-text">Редагувати</button>
					</div>
				</div>
				<div class="card">
					<h3>Картка 2</h3>
					<div class="controls">
						<button class="action-edit-text">Редагувати</button>
					</div>
				</div>
			</div>
			<div class="controls">
				<button class="action-add-text">Додати</button>
			</div>
		</div>
	</div>
</body>
</html>
