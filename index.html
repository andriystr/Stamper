<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Document</title>
	<link rel="stylesheet" href="style.css">
</head>
<body>
	<header>
		<div class="wrapper-left"><button>Back</button></div>
		<h2>Panel</h2>
		<div class="wrapper-right"></div>
	</header>
	
	<div class="frame-wrapper">
		<div class="frame">
			<div class="editor">
				<div class="title">
					<h3>Title</h3>
				</div>
				<div class="text" contenteditable="true" spellcheck="false">
					Оригінальний текст <del>тут була помилка</del> продовження речення.
					Оригінальний текст <ins>пропущене слово</ins> продовження речення.
					Учень написав <ruby><del>молоко</del><rt>малако</rt></ruby> в зошиті.
				</div>
				<div class="controls">
					<button>Verify</button>
				</div>
			</div>
		</div>
	</div>

	<div class="frame-wrapper">
		<div class="frame edit-card">
			<h2>Card name</h2>
			<div class="text-list">
				<div class="editor">
					<div class="title">
						<h3>Title</h3>
						<button>Delete</button>
					</div>
					<div class="text">Some text</div>
				</div>
				<div class="editor">
					<div class="title">
						<h3>Title</h3>
						<button>Delete</button>
					</div>
					<div class="text">Some text</div>
				</div>
			</div>
			<div class="controls">
				<button class="action-add-text">Add</button>
				<button class="action-save-text">Save</button>
			</div>
		</div>
	</div>

	<div class="frame-wrapper active">
		<div class="frame menu">
			<div class="card-list">
				<div class="card">
					<h3>Card 1</h3>
					<div class="controls">
						<button class="action-edit-text">Edit</button>
					</div>
				</div>
				<div class="card">
					<h3>Card 2</h3>
					<div class="controls">
						<button class="action-edit-text">Edit</button>
					</div>
				</div>
			</div>
			<div class="controls">
				<button class="action-add-text">Add</button>
			</div>
		</div>
	</div>
</body>
</html>
