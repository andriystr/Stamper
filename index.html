<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Document</title>
	<script src="tokenizer.js"></script>
</head>
<body>
	<textarea></textarea>
	<br>
	<button>Go</button>
	<output>
		<pre></pre>
	</output>
	<script>
		const ta = document.querySelector('textarea');
		const out = document.querySelector('output > pre');
		const btn = document.querySelector('button');

		btn.addEventListener('click', e => {
			if(ta.value) out.innerText = JSON.stringify(tokenizer(ta.value), null, 2);
		})
	</script>
</body>
</html>
