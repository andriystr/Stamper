<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Stamper</title>
	<link rel="icon" type="image/png" href="favicon.png">
	<link rel="manifest" href="manifest.json">
	<link rel="stylesheet" href="style.css">
	<script src="script.js"></script>
</head>
<body>
	<header>
		<div class="wrapper-left">
			<button class="left"></button>
		</div>
		<h2 class="title">Panel</h2>
		<div class="wrapper-right">
			<button class="right"></button>
		</div>
	</header>
	
	<div class="frame-wrapper">
		<div class="frame trainer">
			<div class="editor">
				<div class="title">
					<h3>Title</h3>
				</div>
				<pre class="text" spellcheck="false"></pre>
				<div class="controls">
					<button class="action-back-text">Back</button>
					<button class="action-check-text">Check</button>
					<button class="action-again-text">Again</button>
					<button class="action-next-text">Next</button>
				</div>
			</div>
		</div>
	</div>

	<div class="frame-wrapper">
		<div class="frame edit-card">
			<h2 class="card-name" contenteditable="true">Card name</h2>
			<div class="text-list"></div>
			<div class="controls">
				<button class="action-add">Add</button>
				<button class="action-save">Save</button>
			</div>
		</div>
	</div>

	<div class="frame-wrapper">
		<div class="frame menu">
			<div class="card-list">
				<div class="card">
					<h3>Card 1</h3>
					<div class="controls">
						<button class="action-edit-text">Edit</button>
					</div>
				</div>
				<div class="card">
					<h3>Card 2</h3>
					<div class="controls">
						<button class="action-edit-text">Edit</button>
					</div>
				</div>
			</div>
			<div class="controls">
				<button class="action-add-text">Add</button>
			</div>
		</div>
	</div>
</body>
</html>
